<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NIDS Console</title>
<style>
:root{--bg:#eef2f1;--panel:#fff;--ink:#14232b;--mute:#5b6b72;--line:#d3dcda;--teal:#0e6b6b;--p1:#c23b22;--p2:#d9a21b;--p3:#3d7ea6}
@media(prefers-color-scheme:dark){:root{--bg:#10191d;--panel:#18262b;--ink:#e6eeee;--mute:#93a5aa;--line:#2b3d43;--teal:#4cc2c2;--p1:#ef6a50;--p2:#e8b84a;--p3:#6aa9d0}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,sans-serif;padding:24px;max-width:1100px;margin-inline:auto}
header{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:12px}
h1{margin:0;font:700 26px/1.1 Georgia,serif}.sub{color:var(--mute);margin:4px 0 0}
button{font:inherit;padding:8px 14px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);cursor:pointer;border-radius:3px}
button.ghost{background:transparent;color:var(--ink)}button:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:18px 0}
.box{background:var(--panel);border:1px solid var(--line);padding:12px 14px}.box b{display:block;font-size:26px;font-family:Georgia,serif}.box span{color:var(--mute);font-size:13px}
.box.hero{border-left:6px solid var(--teal)}
h2{font:700 17px Georgia,serif;margin:22px 0 8px}
.bar{display:grid;grid-template-columns:200px 1fr 40px;gap:8px;align-items:center;font-size:13px;margin:4px 0}.bar i{display:block;height:10px;background:var(--teal)}
.wrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line)}table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--mute);font-weight:600}
.pri{font-weight:700}.pri1{color:var(--p1)}.pri2{color:var(--p2)}.pri3{color:var(--p3)}
#empty{padding:18px;color:var(--mute)}
</style></head><body>
<header><div><h1>Network Intrusion Detection Console</h1><p class="sub">Snort rules · alerts · detection accuracy</p></div>
<div><button id="run">Run attack simulation</button> <button id="clr" class="ghost">Clear alerts</button></div></header>
<div class="grid" id="cards"></div>
<h2>Alerts by type</h2><div id="types"></div>
<h2>Latest alerts</h2>
<div class="wrap"><table><thead><tr><th>Priority</th><th>SID</th><th>Message</th><th>Proto</th><th>Source</th><th>Destination</th></tr></thead><tbody id="rows"></tbody></table><div id="empty">No alerts yet. Select “Run attack simulation” to replay labelled traffic through the rules.</div></div>
<script>
const $=id=>document.getElementById(id), esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const card=(v,l,h)=>`<div class="box${h?" hero":""}"><b>${v}</b><span>${l}</span></div>`;
async function refresh(){
  const [s,a]=await Promise.all([fetch("/api/stats").then(r=>r.json()),fetch("/api/alerts").then(r=>r.json())]);
  const e=s.evaluation||{}, has=e.attacks!==undefined;
  $("cards").innerHTML=card(has?e.detection_rate+"%":"–","Detection rate on simulated attacks",1)+card(has?e.accuracy+"%":"–","Overall accuracy")+
    card(has?e.false_positive_rate+"%":"–","False-positive rate")+card(s.total,"Alerts raised")+card(s.rules_loaded,"Snort rules loaded");
  const max=Math.max(1,...Object.values(s.by_type));
  $("types").innerHTML=Object.entries(s.by_type).sort((x,y)=>y[1]-x[1]).map(([k,v])=>`<div class="bar"><span>${esc(k)}</span><i style="width:${100*v/max}%"></i><span>${v}</span></div>`).join("")||'<p class="sub">Nothing to chart yet.</p>';
  $("rows").innerHTML=a.map(x=>`<tr><td class="pri pri${x.priority}">P${x.priority}</td><td>${x.sid}</td><td>${esc(x.msg)}</td><td>${esc(x.proto)}</td><td>${esc(x.src)}</td><td>${esc(x.dst)}${x.dport?":"+x.dport:""}</td></tr>`).join("");
  $("empty").style.display=a.length?"none":"block";
}
$("run").onclick=async()=>{$("run").disabled=true;await fetch("/api/simulate",{method:"POST"});$("run").disabled=false;refresh()};
$("clr").onclick=async()=>{await fetch("/api/clear",{method:"POST"});refresh()};
refresh();setInterval(refresh,3000);
</script></body></html>
